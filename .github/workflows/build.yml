name: Build and Release Nothing-Island

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare APK for Artifact & Release
        run: |
          mkdir -p build-output
          cp app/build/outputs/apk/release/app-release.apk build-output/Nothing-Island-v1.0.3.apk
          ls -la build-output/

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nothing-Island-v1.0.3
          path: build-output/Nothing-Island-v1.0.3.apk
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Nothing Island v1.0.3 (Real-Time Spotify & All Apps Logos + Zero Crash)
          tag_name: v1.0.3
          files: build-output/Nothing-Island-v1.0.3.apk
          draft: false
          prerelease: false
          body: |
            ## 🔴 (NOT) ISLAND v1.0.3 // Real-Time App Logos & Rock-Solid Architecture

            This release completely eliminates background crashes during Spotify playback, introduces real-time app logos for WhatsApp/Telegram/Spotify, and delivers a seamless Nothing OS 3.0 Dynamic Island.

            ### 🚀 What's New & Fixed in v1.0.3
            - **Zero Crash During Media Playback**: Removed restricted foreground service types that caused Android 14/15 system server to kill the app when Spotify or any player started.
            - **Dynamic App & Media Logos**:
              - **Spotify & Music Players**: Compact island now displays the real Spotify green logo or live Album Cover art on the left, and dancing 4-column Nothing Red dot-matrix equalizer on the right.
              - **All Notifications (WhatsApp, Telegram, Instagram, etc.)**: Compact & expanded island now dynamically extract the official sender app icon and display real-time message previews.
            - **Always-Visible Standby Island**:
              - Framing the front camera cutout with an iconic Nothing Crimson red dot (`●`) and `NOTHING` NDot57 dot-matrix typography.
            - **100% On-Device & Zero Trackers**: No internet permission in manifest.

            ### 📦 Direct Download
            **[Nothing-Island-v1.0.3.apk](https://github.com/d4rxh/Nothing-Island/releases/download/v1.0.3/Nothing-Island-v1.0.3.apk)**
