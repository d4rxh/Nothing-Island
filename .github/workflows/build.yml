name: Build and Release Nothing-Island

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare APK for Artifact & Release
        run: |
          mkdir -p build-output
          cp app/build/outputs/apk/release/app-release.apk build-output/Nothing-Island-v1.0.10.apk
          ls -la build-output/

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nothing-Island-v1.0.10
          path: build-output/Nothing-Island-v1.0.10.apk
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Nothing Island v1.0.10 (Landscape Auto-Hide, Paused Music Persistence, Zero Emojis & NDot Typography)
          tag_name: ${{ github.ref_name }}
          files: build-output/Nothing-Island-v1.0.10.apk
          draft: false
          prerelease: false
          body: |
            ## (NOT) ISLAND v1.0.10 // Production Release

            ### What's New & Fixed:
            - **Landscape Gaming & Video Auto-Hide**: Detects orientation changes (`ORIENTATION_LANDSCAPE`) and automatically hides the island when entering games (BGMI, COD, PUBG) or fullscreen videos (YouTube, Netflix) so it does not drift to the top of the landscape screen or block in-game UI.
            - **Notification Equalizer Isolation**: Fixed notification beat bug. The dot-matrix equalizer animator is explicitly stopped and hidden whenever a heads-up notification or call arrives.
            - **Persistent Paused Music Player**: Music pausing no longer resets the Dynamic Island to IDLE. It transitions gracefully into `MUSIC_PAUSED_COMPACT` with flat indicator dots and provides an instant PLAY (▶) control in the expanded card to resume playback anytime.
            - **Strict Zero Emojis**: Replaced all emojis throughout the app with authentic Nothing OS 3.0 brutalist typography.
            - **System-Wide NDot57 Typography**: Recursively applied Nothing's iconic `ndot57.otf` font across all TextViews, Buttons, Badges, and overlay cards.
            - **100% On-Device Privacy & Security Audit**: Zero internet permission (`android.permission.INTERNET` absent from manifest), zero telemetry, zero analytics.

            ### Direct APK Download
            **[Nothing-Island-v1.0.10.apk](https://github.com/d4rxh/Nothing-Island/releases/download/v1.0.10/Nothing-Island-v1.0.10.apk)**
