name: Build and Release Nothing-Island

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare APK for Artifact & Release
        run: |
          mkdir -p build-output
          cp app/build/outputs/apk/release/app-release.apk build-output/Nothing-Island-v1.0.6.apk
          ls -la build-output/

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nothing-Island-v1.0.6
          path: build-output/Nothing-Island-v1.0.6.apk
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Nothing Island v1.0.6 (Direct WindowManager Overlay & Force Show Integration)
          tag_name: v1.0.6
          files: build-output/Nothing-Island-v1.0.6.apk
          draft: false
          prerelease: false
          body: |
            ## 🔴 (NOT) ISLAND v1.0.6 // Direct WindowManager Overlay & Instant Punch-Hole Visibility

            This release fixes the Android status-bar cutout clipping issue by restoring `FLAG_LAYOUT_NO_LIMITS` and `FLAG_LAYOUT_IN_SCREEN`, wraps inflation with `ContextThemeWrapper`, prevents double-attach race conditions, and introduces a one-tap `FORCE SHOW ISLAND ON SCREEN` trigger in the app dashboard.

            ### 🚀 Highlights in v1.0.6
            - **Restored `FLAG_LAYOUT_NO_LIMITS`**: Allows the overlay window to extend directly across the status bar and display cutout without being clipped or hidden by Android OS.
            - **ContextThemeWrapper**: Ensures view hierarchy inflation receives full theme metrics and dimensions.
            - **Single-Attach Guard**: Eliminates WindowManager token collisions.
            - **One-Tap "FORCE SHOW ISLAND ON SCREEN"**: Dedicated dashboard button instantly renders the Dynamic Island on screen with active coordinates.
            - **Always-On-Screen Standby Mode**: High contrast Nothing pill with crimson dot (`●`) and NDot57 dot-matrix typography.
            - **Spotify Zero-Crash & Live Real-Time Equalizer**: Real Spotify logo and 4-column dot-matrix visualizer.

            ### 📦 Direct Download
            **[Nothing-Island-v1.0.6.apk](https://github.com/d4rxh/Nothing-Island/releases/download/v1.0.6/Nothing-Island-v1.0.6.apk)**
