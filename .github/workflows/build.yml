name: Build and Release Nothing-Island

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare APK for Artifact & Release
        run: |
          mkdir -p build-output
          cp app/build/outputs/apk/release/app-release.apk build-output/Nothing-Island-v1.0.12.apk
          ls -la build-output/

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nothing-Island-v1.0.12
          path: build-output/Nothing-Island-v1.0.12.apk
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Nothing Island v1.0.12 (Live Charging %, Full Notification Expanded Card, Tap-to-Open & Cricket Spam Filter)
          tag_name: ${{ github.ref_name }}
          files: build-output/Nothing-Island-v1.0.12.apk
          draft: false
          prerelease: false
          body: |
            ## (NOT) ISLAND v1.0.11 // Production Release

            ### What's New & Fixed:
            - **Landscape Gaming Camera Notch Anchor**: During gaming (BGMI, COD, PUBG) or landscape fullscreen videos, the island stays strictly anchored around the physical camera punch-hole on the left/right bezel via hardware `DisplayCutout` coordinates. It never jumps to the top long edge or obstructs gameplay.
            - **Instant Real-Time Media Dismissal**: Swiping away Spotify from recent apps, stopping playback, or dismissing media notifications now immediately clears the island and restores IDLE state.
            - **Reliable Dynamic Charging & Battery Broadcast**: Added dynamic runtime broadcast receiver for `ACTION_POWER_CONNECTED`, `ACTION_POWER_DISCONNECTED`, and `ACTION_BATTERY_CHANGED`. Fast charging glyph, battery percentage, and tactile haptic feedback trigger instantly upon cable connection.
            - **Zero Emojis & System-Wide NDot57 Font**: Pure Nothing OS 3.0 brutalist typography.

            ### Direct APK Download
            **[Nothing-Island-v1.0.11.apk](https://github.com/d4rxh/Nothing-Island/releases/download/v1.0.11/Nothing-Island-v1.0.11.apk)**
