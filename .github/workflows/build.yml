name: Build and Release Nothing-Island

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare APK for Artifact & Release
        run: |
          mkdir -p build-output
          cp app/build/outputs/apk/release/app-release.apk build-output/Nothing-Island-v1.0.17.apk
          ls -la build-output/

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nothing-Island-v1.0.17
          path: build-output/Nothing-Island-v1.0.17.apk
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Nothing Island v1.0.17 (Voice Recorder, System Clock/Stopwatch, Clean Screenshot Gesture, Reliable Calls & Glitch-Free Charging)
          tag_name: ${{ github.ref_name }}
          files: build-output/Nothing-Island-v1.0.17.apk
          draft: false
          prerelease: false
          body: |
            ## Nothing Island v1.0.17 Release

            ### What's New & Fixed:
            - **Voice Recorder & System Stopwatch/Timer Support**: Real-time integration with Nothing Sound Recorder, Google Recorder, Google Clock, and system clock apps. Shows running recording duration with a pulsing red LED indicator and countdown/stopwatch timers right in the pill.
            - **Clean Screenshot Gesture (Zero Island in Screenshots)**: Swipe UP or double-tap on the island to momentarily hide it for 6 seconds, allowing you to take 100% clean screenshots without the island overlay getting captured.
            - **Glitch-Free YouTube & Charging**: Fixed charging banner popping up during YouTube playback. Charging alert now only flashes briefly upon initial cable connection (for 3.5s) and never interrupts active video or media.
            - **Multi-Notification Stability**: Fixed dynamic island collapsing or mixing up messages when multiple notifications arrive in rapid succession.
            - **Reliable Incoming & Ongoing Calls**: Added direct TelephonyManager state listener alongside Notification CallStyle parser for 100% reliable detection of incoming/active phone calls and VoIP calls (WhatsApp, Truecaller).

            ### Direct APK Download
            **[Nothing-Island-v1.0.17.apk](https://github.com/d4rxh/Nothing-Island/releases/download/v1.0.17/Nothing-Island-v1.0.17.apk)**
