name: Build and Release Nothing-Island

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare APK for Artifact & Release
        run: |
          mkdir -p build-output
          cp app/build/outputs/apk/release/app-release.apk build-output/Nothing-Island-v1.0.1.apk
          ls -la build-output/

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nothing-Island-v1.0.1
          path: build-output/Nothing-Island-v1.0.1.apk
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Nothing Island v1.0.1 (Crash-Fix & Size Customizer)
          tag_name: v1.0.1
          files: build-output/Nothing-Island-v1.0.1.apk
          draft: false
          prerelease: false
          body: |
            ## 🔴 (NOT) ISLAND v1.0.1 // Hotfix & Ultimate Island Customizer

            This release fixes the startup overlay crash, introduces a comprehensive size/position customizer, and guarantees 100% on-device privacy.

            ### 🚀 What's New & Fixed in v1.0.1
            - **Overlay Permission Crash Fixed**: Replaced non-vector notification small icon with dedicated monochrome vector asset `ic_notification_island.xml` and added safe foreground service fallbacks for Android 14/15 (Nothing OS 2.5 / 3.0).
            - **Display Over Other Apps Re-entry Safe**: Safe guard against duplicate WindowManager view attachments when returning from system settings.
            - **Dynamic Island Size & Geometry Customization**:
              - **Width Slider**: Adjust compact pill minimum width from 70 dp to 220 dp.
              - **Height Slider**: Adjust compact pill height from 28 dp to 50 dp.
              - **Corner Radius Slider**: Real-time adjustment from squircle (8 dp) to full capsule pill (26 dp).
              - **Horizontal X Offset**: Slide anywhere from -120 dp (left hole) to +120 dp (right hole).
              - **Vertical Y Position**: Fine-tune distance from top bezel (0 dp to 60 dp).
              - **Camera Cutout Diameter**: Resize center cutout spacer from 16 dp to 44 dp.
            - **Revamped Flagship UI**: Deep brutalist Nothing OS 3.0 cards, crisp typography, and real-time live preview studio.
            - **Zero Data Leak Guarantee**: Fully verified zero internet permission (`android.permission.INTERNET` absent). 100% on-device.

            ### 📦 Direct Download
            Download the signed release APK below:
            **Nothing-Island-v1.0.1.apk**
