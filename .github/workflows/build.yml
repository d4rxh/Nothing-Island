name: Build and Release Nothing-Island

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare APK for Artifact & Release
        run: |
          mkdir -p build-output
          cp app/build/outputs/apk/release/app-release.apk build-output/Nothing-Island-v1.0.9.apk
          ls -la build-output/

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nothing-Island-v1.0.9
          path: build-output/Nothing-Island-v1.0.9.apk
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Nothing Island v1.0.9 (Zero Music Size Jumps, Custom Touch Interception, and Native Lock Screen A11y)
          tag_name: ${{ github.ref_name }}
          files: build-output/Nothing-Island-v1.0.9.apk
          draft: false
          prerelease: false
          body: |
            ## 🔴 (NOT) ISLAND v1.0.9 // Fixed Music Size, 100% Touch Interception & Native Lock Screen

            ### What's Fixed:
            - **No More Music Size Jumps (Stays Compact)**: Music mode now maintains the exact user-configured island width (e.g. 110dp). In compact mode it shows only Album Art on the left and the Dancing Red Dot-Matrix Equalizer on the right. Tapping expands into the full 290dp media controller card.
            - **Notification Bar Gesture Stealing Fixed**: Custom `IslandRootLayout` uses `requestDisallowInterceptTouchEvent(true)` and `onInterceptTouchEvent()` to claim status-bar edge taps, preventing the Android notification shade from stealing clicks.
            - **Lock Screen Activity Removed & Native Accessibility Overlay Added**: Removed the problematic Lockscreen Activity that was blocking PIN/fingerprint unlock and back gestures. Integrated native Accessibility Service overlay (`TYPE_ACCESSIBILITY_OVERLAY`) allowing dynamic island on lock screen safely without ever interfering with unlock gestures.

            ### 📦 Direct APK Download
            **[Nothing-Island-v1.0.9.apk](https://github.com/d4rxh/Nothing-Island/releases/download/v1.0.9/Nothing-Island-v1.0.9.apk)**
