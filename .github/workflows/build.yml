name: Build and Release Nothing-Island

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare APK for Artifact & Release
        run: |
          mkdir -p build-output
          TAG_NAME="${{ github.ref_name }}"
          if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "main" ]; then
            TAG_NAME="latest"
          fi
          cp app/build/outputs/apk/release/app-release.apk "build-output/Nothing-Island-${TAG_NAME}.apk"
          ls -la build-output/

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nothing-Island-release-apk
          path: build-output/Nothing-Island-*.apk
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "Nothing Island ${{ github.ref_name }} (Complete dynamicSpot Parity - Interactive Touch Seekbar, Action Pills, Volume HUD, Outside-Touch Collapse & DND)"
          tag_name: ${{ github.ref_name }}
          files: build-output/Nothing-Island-*.apk
          draft: false
          prerelease: false
          body: |
            ## Nothing Island ${{ github.ref_name }} — Complete dynamicSpot Parity Release

            All major features of dynamicSpot reverse-engineered, optimized, and natively rebuilt for Nothing OS (Android 14/15) with zero tracking and pure OLED dot-matrix aesthetics.

            ### What's New:
            - **Interactive Touch & Scrub Media Seekbar**: Directly scrub through active Spotify/YouTube Music tracks right inside the expanded island card with real-time elapsed/duration timers.
            - **Dynamic Notification Action Pills**: WhatsApp "Mark as Read", Gmail "Archive", Quick Reply, and custom actions rendered as authentic Nothing pills.
            - **Touch Outside to Collapse**: Tap anywhere outside the expanded island card to instantly dismiss it back to compact pill (`FLAG_WATCH_OUTSIDE_TOUCH`).
            - **Long-Press Capsule Gesture**: Long-press compact pill to instantly toggle playback or open source app.
            - **Do Not Disturb (DND) Filter**: Respects system Zen Mode and DND—no intrusive popups during focus sessions or gaming.
            - **Dynamic Volume HUD Pill**: Physical volume button presses trigger a sleek 1.8s volume status pill.
            - **Dual Island Split Pill**: Real-time dual island capsules for simultaneous Music + Charging, Timer, or Calls.
            - **App Blacklist / Game Mode**: Temporarily hides overlay inside camera, YouTube full-screen, and games.
            - **Battery Alerts**: Smart alerts for Low Battery (<=15%) and Full Battery (100%).
            - **Configurable Auto-Hide Timeout**: Choose notification banner visibility duration (2s - 15s).
