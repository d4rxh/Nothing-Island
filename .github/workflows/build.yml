name: Build and Release Nothing-Island

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare APK for Artifact & Release
        run: |
          mkdir -p build-output
          cp app/build/outputs/apk/release/app-release.apk build-output/Nothing-Island-v1.0.4.apk
          ls -la build-output/

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nothing-Island-v1.0.4
          path: build-output/Nothing-Island-v1.0.4.apk
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Nothing Island v1.0.4 (Always-On-Screen & Instant Visibility)
          tag_name: v1.0.4
          files: build-output/Nothing-Island-v1.0.4.apk
          draft: false
          prerelease: false
          body: |
            ## 🔴 (NOT) ISLAND v1.0.4 // Always-On-Screen Dynamic Island

            This release guarantees that the Dynamic Island appears instantly on screen upon granting overlay permission, remains visible 24/7 across all apps, and responds immediately to Spotify, WhatsApp, and charging.

            ### 🚀 Highlights in v1.0.4
            - **Always-On-Screen 24/7 Overlay**: Managed directly through `IslandOverlayManager` tied to the persistent `NotificationListenerService` system lifecycle.
            - **Instant Display Fix**: Fixed the Master Switch toggle permission race condition where the service was not getting triggered upon returning from Settings.
            - **Visible High-Contrast Standby Pill**: Prominent Nothing capsule framing the camera cutout with glowing crimson dot (`●`), NDot57 typography, and `#444444` crisp outline.
            - **Real-Time App Logos**: Automatic official icons for Spotify, YouTube Music, WhatsApp, Telegram, Instagram, and phone calls.
            - **Zero Data Leak**: 100% on-device, no internet permission in manifest.

            ### 📦 Direct Download
            **[Nothing-Island-v1.0.4.apk](https://github.com/d4rxh/Nothing-Island/releases/download/v1.0.4/Nothing-Island-v1.0.4.apk)**
