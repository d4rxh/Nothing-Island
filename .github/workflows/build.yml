name: Build and Release Nothing-Island

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare APK for Artifact & Release
        run: |
          mkdir -p build-output
          cp app/build/outputs/apk/release/app-release.apk build-output/Nothing-Island-v1.0.7.apk
          ls -la build-output/

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nothing-Island-v1.0.7
          path: build-output/Nothing-Island-v1.0.7.apk
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Nothing Island v1.0.7 (Interactive Touch, Attached-to-Top Notch & Lock Screen Overlay)
          tag_name: v1.0.7
          files: build-output/Nothing-Island-v1.0.7.apk
          draft: false
          prerelease: false
          body: |
            ## 🔴 (NOT) ISLAND v1.0.7 // Interactive Touch, Attached Bezel Style & Lock Screen Support

            This major update resolves all user-reported interaction and visual issues:
            - **Interactive Touch-to-Expand**: Tapping the Dynamic Island instantly expands it with smooth Overshoot animation into the full Nothing OS brutalist media controller card (Previous, Play/Pause, Next).
            - **iPhone-Style "Attach to Top Bezel" Mode**: New customization switch allows the island to sit completely flush with the phone's top frame (`y = 0` with flat top corners and rounded bottom corners), looking physically integrated with the hardware bezel.
            - **Lock Screen Support (`FLAG_SHOW_WHEN_LOCKED`)**: The Dynamic Island now stays 100% visible across the Lock Screen and Always-on Display.
            - **Proper Music Sizing (No Shrinking)**: Playing music now gracefully widens the island to display the official Spotify icon, live track title, and 4-column Nothing Red dot-matrix equalizer.

            ### 📦 Direct Download
            **[Nothing-Island-v1.0.7.apk](https://github.com/d4rxh/Nothing-Island/releases/download/v1.0.7/Nothing-Island-v1.0.7.apk)**
