name: Build and Release Nothing-Island

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare APK for Artifact & Release
        run: |
          mkdir -p build-output
          cp app/build/outputs/apk/release/app-release.apk build-output/Nothing-Island-v1.0.16.apk
          ls -la build-output/

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nothing-Island-v1.0.16
          path: build-output/Nothing-Island-v1.0.16.apk
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Nothing Island v1.0.16 (Flush Top Bezel, Persistent Pill Dimensions & Minimal Clean UI)
          tag_name: ${{ github.ref_name }}
          files: build-output/Nothing-Island-v1.0.16.apk
          draft: false
          prerelease: false
          body: |
            ## Nothing Island v1.0.16 Release

            ### What's New & Fixed:
            - **Zero-Gap Flush Bezel Attachment**: When "Attach to Top Bezel" is enabled, the island is drawn completely flush against the display bezel with zero subpixel gap, shadow halo, or border artifact.
            - **Persistent Pill Height Fix**: Fixed an issue where customized pill height reset back to default after incoming notifications or orientation changes. User geometry preferences are now preserved across all system events and state transitions.
            - **Minimal & Clean Presentation**: Refined visual presentation, removed noisy markers, and aligned documentation to Nothing OS minimal standards.
            - **Flagship Feature Suite**: Full support for Incoming/Ongoing Calls, built-in Timer and Stopwatch, Connectivity & Device events, Google Maps Navigation, and inline Quick Reply.

            ### Direct APK Download
            **[Nothing-Island-v1.0.16.apk](https://github.com/d4rxh/Nothing-Island/releases/download/v1.0.16/Nothing-Island-v1.0.16.apk)**
