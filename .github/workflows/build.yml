name: Build and Release Nothing-Island

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare APK for Artifact & Release
        run: |
          mkdir -p build-output
          cp app/build/outputs/apk/release/app-release.apk build-output/Nothing-Island-v1.0.2.apk
          ls -la build-output/

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nothing-Island-v1.0.2
          path: build-output/Nothing-Island-v1.0.2.apk
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Nothing Island v1.0.2 (Clean Play Protect & Visible Standby)
          tag_name: v1.0.2
          files: build-output/Nothing-Island-v1.0.2.apk
          draft: false
          prerelease: false
          body: |
            ## 🔴 (NOT) ISLAND v1.0.2 // Zero-Crash & Clean Play Protect Release

            This release eliminates the Play Protect trigger, fixes the overlay launch crash, and makes the standby Dynamic Island immediately visible around the punch hole.

            ### 🚀 Highlights in v1.0.2
            - **Play Protect Warning Resolved**:
              - Migrated foreground service from restricted `specialUse` to official `mediaPlayback` (`FOREGROUND_SERVICE_MEDIA_PLAYBACK`).
              - Added Android v3 APK Signature Scheme (`enableV3Signing = true`).
            - **Visible Standby Island**:
              - Punch-hole island is now instantly visible upon granting permission, featuring the iconic Nothing Red dot (`●`) and `NOTHING` typography.
            - **Overlay Startup Crash Fixed**:
              - Removed problematic `FLAG_LAYOUT_NO_LIMITS` and `FLAG_HARDWARE_ACCELERATED` from WindowManager params.
              - Added graceful fallback in `startIslandServiceSafely()` if foreground service start is delayed.
            - **Zero Data Leak Guarantee**:
              - 100% on-device, 0 internet permission (`android.permission.INTERNET` absent).

            ### 📦 Direct Download
            **[Nothing-Island-v1.0.2.apk](https://github.com/d4rxh/Nothing-Island/releases/download/v1.0.2/Nothing-Island-v1.0.2.apk)**
