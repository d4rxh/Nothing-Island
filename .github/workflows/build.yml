name: Build and Release Nothing-Island

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare APK for Artifact & Release
        run: |
          mkdir -p build-output
          cp app/build/outputs/apk/release/app-release.apk build-output/Nothing-Island-v1.0.5.apk
          ls -la build-output/

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nothing-Island-v1.0.5
          path: build-output/Nothing-Island-v1.0.5.apk
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Nothing Island v1.0.5 (Android 14/15 24/7 Foreground Service & Zero-Crash Architecture)
          tag_name: v1.0.5
          files: build-output/Nothing-Island-v1.0.5.apk
          draft: false
          prerelease: false
          body: |
            ## 🔴 (NOT) ISLAND v1.0.5 // Final Rock-Solid Release

            This release completely solves the background process killing on Android 14/15 (Nothing OS 2.6 / 3.0), implements the official `specialUse` foreground service with persistent silent notification, and guarantees 24/7 Always-On-Screen Dynamic Island.

            ### 🚀 Highlights in v1.0.5
            - **Official Android 14/15 Foreground Service**:
              - Declared official `specialUse` type with `PROPERTY_SPECIAL_USE_FGS_SUBTYPE` and `POST_NOTIFICATIONS`.
              - App Info now cleanly displays "Notifications: Allowed" and shows active `(NOT) ISLAND ACTIVE` silent status.
              - Nothing OS and Android OS will NEVER freeze, kill, or hibernate the overlay service.
            - **Spotify Playback Zero-Crash Guarantee**:
              - Completely decoupled from restrictive mediaPlayback checks, eliminating `SecurityException`.
              - Displays real green Spotify app logo, live dancing 4-column dot-matrix equalizer, and album art.
            - **Real-Time App Notifications**:
              - WhatsApp, Telegram, Instagram, etc. display their real icons and previews.
            - **24/7 Standby Island**:
              - Always-on capsule framing the camera punch-hole with Nothing Red dot (`●`) and NDot57 dot-matrix typography.
            - **Zero Data Leak**:
              - 100% on-device, zero internet permission (`android.permission.INTERNET` strictly absent).

            ### 📦 Direct Download
            **[Nothing-Island-v1.0.5.apk](https://github.com/d4rxh/Nothing-Island/releases/download/v1.0.5/Nothing-Island-v1.0.5.apk)**
